// Android build config for the `livebuy_flutter` plugin.
//
// This file makes the plugin's native Kotlin bridge (src/main/kotlin/tv/livebuy/flutter/*)
// compilable by a host Flutter app. Without it the plugin only ships Dart + a
// MethodChannel contract that is never compiled against the real Android SDK —
// native bridge breakage (an SDK API rename, a new enum case, a changed model
// type) would only surface in a consumer's `./gradlew assembleDebug`, far too late.
// CI compiles it via flutter/example (see .github/workflows/flutter-bridge-build.yml).
//
// Dependency on the Livebuy Android SDK (`tv.livebuy.sdk.*`):
//   • In the monorepo (CI + local dev) the SDK is published to mavenLocal first
//     (`./gradlew :livebuy:publishToMavenLocal` with the publish init script) so it
//     is consumed as a pre-built AAR. The SDK is pinned to AGP 8.2.2 / Gradle 8.6
//     and the host app to AGP 9 / Gradle 9.1 — incompatible for a Gradle composite
//     build, so an AAR consumed across toolchains is the supported path.
//   • Published consumers (pub.dev) resolve the same coordinates from JitPack via
//     the host app's repositories.
group = "tv.livebuy.flutter"
version = "1.3.0"

buildscript {
    ext.kotlin_version = "2.3.20"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:9.0.1"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

android {
    namespace = "tv.livebuy.flutter"
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        // flutter-android-auto-pip-entry — JVM unit tests for the pure AutoPipPolicy helpers.
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }
}

repositories {
    mavenLocal()   // resolves tv.livebuy:livebuy (published by bootstrap.sh / flutter-bridge-build CI via `:livebuy:publishToMavenLocal -PuseRealIvs`)
    google()
    mavenCentral()
    // Livebuy Android SDK remote channel — static Maven tree served by GitHub Pages
    // from the public mirror repo `ariesweng/livebuy-android-sdk` (symmetric to iOS,
    // and to react-native/android/build.gradle's identical declaration). This is the
    // PRIMARY published-consumer channel; jitpack below is a fallback only.
    maven { url "https://ariesweng.github.io/livebuy-android-sdk/" }
    maven { url "https://jitpack.io" }   // published-consumer fallback for the SDK artifact
}

dependencies {
    // Livebuy Android SDK — the bridge imports tv.livebuy.sdk.{LivebuySDK, models, events, player, widget, core}.
    // Version is the outward-facing Maven coordinate (LIVEBUY_MAVEN_VERSION) and MUST be a PUBLISHED
    // remote-channel version (Livebuy Pages Maven / JitPack fallback above) whose core artifact carries
    // the bridge's full core API surface. Do NOT pin the core-internal `defaultConfig.versionName`
    // (X-SDK-Version header only; the remote channel has NO such artifact, so it is unresolvable for
    // pub.dev consumers). Distinct from this file's own `version` (the tv.livebuy.flutter plugin
    // artifact version) — different version axis.
    //
    // Current pin: 4.18.0 (flutter-android-bridge-core-pin-4-18-0, routine follow-up to
    // v4.18.0's real, lockstep iOS+Android release) — bumped from 4.17.0. UNLIKE the prior
    // 4.16.0 → 4.17.0 round (core had ZERO production-code changes), this round's `:livebuy`
    // core module DOES have real production-code changes — verified against
    // `livebuy-android-sdk/CHANGELOG.md`'s `[4.18.0]` entry in full: disconnected-streamer
    // confirmation-based recovery, `setMuted` during the intro now carrying over into main
    // playback, three real-device playback bug fixes, `PollManager`'s first poll now firing
    // immediately (Android-only) — and, most importantly for this bridge, a new public
    // `isMuted` getter on `LivebuyPlayerView` backing the
    // `mute-preference-persist-across-session-android-core` change. This bridge's
    // `LivebuyPlayerViewFactory.kt` ALREADY calls `playerView.isMuted` — that symbol only
    // became part of the PUBLISHED artifact as of 4.18.0, so the prior 4.17.0 pin was, for a
    // real external consumer, potentially unresolvable at that call site. Confirmed via `javap`
    // disassembly of the published `4.18.0` AAR's `classes.jar` that `LivebuyPlayerView` does
    // carry an `isMuted` method — a check plain `import` grepping can't do, since a getter on an
    // already-imported class adds no new `import` line.
    //
    // Prior pin history: 4.13.1 → 4.16.0 was an AD-HOC bump (commit 671cdcbe6, 2026-09-09,
    // diagnosing a Flutter live-chat delivery issue later found unrelated to this pin) made
    // WITHOUT going through the OpenSpec change flow. 4.16.0 → 4.17.0
    // (flutter-android-bridge-core-pin-4-17-0) backfilled that governance gap and was itself a
    // zero-core-change routine bump.
    //
    // ⚠️ THIS PIN WILL GO STALE AGAIN — read before bumping it (or trusting it).
    // In the monorepo + CI this pin does NOT gate correctness: flutter-bridge-build.yml /
    // bootstrap.sh publish :livebuy to mavenLocal under THIS EXACT coordinate string
    // (`-PLIVEBUY_MAVEN_VERSION=<parsed from this file>`), so the AAR is always built from
    // current HEAD source regardless of what version number is written here. Only a PUBLISHED
    // pub.dev / git-dependency consumer resolves the REAL remote artifact at this pin — that is
    // the only path that ever proves whether the pin is actually still good. This is exactly how
    // the pin 3.2.0 once went undetected-stale: it satisfied every monorepo/CI build while
    // silently resolving pre-rename classes for real external consumers (see change
    // `flutter-distribution-core-pin-refresh` for the incident). This round's `isMuted` gap is
    // the same failure mode, caught earlier: core added a symbol the bridge already references
    // before the pin caught up — always re-check bridge Kotlin source against the target
    // version's CHANGELOG for new public API, not just "did core change at all".
    implementation "tv.livebuy:livebuy:4.18.0"

    // The bridge uses kotlinx.coroutines directly (CoroutineScope / Dispatchers / launch).
    // The SDK pulls it transitively but as `implementation`, so it is not on the
    // plugin's compile classpath — declare it explicitly.
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    // flutter-android-auto-pip-entry — JVM unit tests for the zero-Android-dependency
    // AutoPipPolicy pure helpers (AutoPipPolicyTest).
    testImplementation "junit:junit:4.13.2"
}
